<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: "poppins",sans-serif;
        }
        body{
            width:100%;
            height:100vh ;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:linear-gradient(45deg,#0a0a0a,#3a4452);
            color: white;
        }
        .calculator{
            border:1px solid gray;
            padding:20px;
            border-radius: 16px;
            background: transparent;
            box-shadow: 0px 3px 15px rgba(113,115,119,0.5);
        }
        input{
            width: 320px;
            border:none;
            padding:24px;
            margin:10px;
            background:transparent;
            box-shadow: 0px 3px 15px rgba(84,84,84,0.1);
            font-size:40px;
            text-align: right;
            cursor: pointer;
            color:white;
        }
        input::placeholder{
            color:white;

        }
        button{
            border:none;
            width:60px;
            height: 60px;
            margin: 10px;
            border-radius:50%;
            background:transparent;
            color:white;
            font-size: 20px;
            box-shadow: -8px -8px 15px rgba(255,255,255,0.1);
            cursor:pointer;

        }
        .equalbtn{
            background-color: #fb7c14;

        }
        .operator{
            color:#6dee0a;

        }
        button:hover{
            
            background-image: linear-gradient(black,blue);
        }
    

    </style>
    
</head>
<body>
    <h1>calculator</h1>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputbox" readonly>

        <div>
            <button type="button" class="operator">AC</button>
            <button type="button" class="operator">DEL</button>
            <button type="button" class="operator">%</button>
            <button type="button" class="operator">/</button>
        </div>
        <div>
            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button type="button" class="operator">*</button>
        </div>
        <div>
            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button type="button" class="operator">-</button>
        </div>
        <div>
            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button type="button" class="operator">+</button>
        </div>
        <div>
            <button type="button">00</button>
            <button type="button">0</button>
            <button type="button">.</button>
            <button type="button" class="equalbtn">=</button>
        </div>
    </div>
       



    <script>
        const input = document.getElementById('inputbox');
        const buttons = document.querySelectorAll('button');
        let string = '';

        buttons.forEach((button) => {
            button.addEventListener('click', (event) => {
                const value = event.target.innerHTML.trim();

                if (value === '=') {
                    try {
                        string = Function(`"use strict"; return (${string})`)();
                        input.value = string;
                    } catch {
                        string = '';
                        input.value = 'Error';
                    }
                } else if (value === 'AC') {
                    string = '';
                    input.value = '';
                } else if (value === 'DEL') {
                    string = string.slice(0, -1);
                    input.value = string;
                } else {
                    string += value;
                    input.value = string;
                }
            });
        });
    </script>
    
</body>
</html>
